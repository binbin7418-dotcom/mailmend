name: build-windows

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller mailmend.spec
      - name: Package
        run: Compress-Archive -Path dist/MailMend -DestinationPath MailMend-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MailMend-Windows
          path: MailMend-Windows.zip
